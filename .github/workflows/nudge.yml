# Sends the daily nudge. Runs every 30 minutes and asks the app whether the chosen time has arrived.
# The app sends at most one notification a day. Needs two repository secrets:
#   APP_URL      for example https://invest-xyz.vercel.app
#   CRON_SECRET  the same value as in Vercel
name: Daily nudge
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
jobs:
  nudge:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ask the app to send the nudge if it is time
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL or CRON_SECRET secret is missing"; exit 0; fi
          curl --fail --silent --show-error --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/nudge"
